<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUS Pro - Derece Çalışma İstasyonu</title>
  
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/387/387561.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/387/387561.png">

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #e2e8f0;
      --opt-bg: #ffffff;
    }

    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
      --opt-bg: #1e293b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
    }

    .app-container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }

    .header h1 {
      font-size: 20px;
      margin: 0;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle {
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--subtext);
    }

    .badge {
      background: rgba(79, 70, 229, 0.1);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
    }

    .timer-badge {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warning);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
    }

    .question-card {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-btn {
      padding: 14px 18px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--opt-bg);
      color: var(--text);
      text-align: left;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--primary);
    }

    .opt-btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #15803d !important; font-weight: bold; }
    .opt-btn.wrong { background: #fee2e2 !important; border-color: var(--danger) !important; color: #b91c1c !important; }

    .exp-box {
      margin-top: 20px;
      padding: 16px;
      border-left: 4px solid var(--primary);
      background: rgba(79, 70, 229, 0.05);
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.6;
    }

    .action-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .next-btn {
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .next-btn:disabled {
      background: var(--border);
      color: var(--subtext);
      cursor: not-allowed;
    }

    .import-area {
      width: 100%;
      height: 180px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: monospace;
      font-size: 13px;
      margin-bottom: 12px;
      resize: vertical;
    }

    .btn-import {
      padding: 12px 20px;
      background: var(--success);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>🩺 TUS Pro Çalışma İstasyonu</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙 Gece / Gündüz</button>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchMode('quiz', this)">📝 Test Modu</button>
    <button class="tab-btn" onclick="switchMode('srs', this)">🧠 Aralıklı Tekrar (Anki)</button>
    <button class="tab-btn" onclick="switchMode('wrong', this)">❌ Yanlış Havuzu</button>
    <button class="tab-btn" onclick="switchMode('import', this)">📥 Soru Yükle</button>
  </div>

  <div id="app-body">
    <div class="meta-bar" id="meta-bar">
      <span class="badge" id="branch-badge">Farmakoloji</span>
      <span class="timer-badge" id="timer-display">⏱ 01:30</span>
      <span id="score-text">Puan: 0</span>
    </div>

    <div id="quiz-view">
      <div class="question-card" id="question-text">Soru Yükleniyor...</div>
      <div class="options-grid" id="options-container"></div>
      <div class="exp-box" id="explanation-box" style="display: none;"></div>
      <div class="action-row">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()" disabled>Sonraki Soru ➔</button>
      </div>
    </div>

    <div id="import-view" style="display: none;">
      <h3>📥 Doğrudan Soru Ekle</h3>
      <p style="font-size:14px; color:var(--subtext);">Sohbetten kopyaladığın soru metnini aşağıdaki kutuya yapıştırıp "Soruları Yükle" butonuna basman yeterli!</p>
      <textarea class="import-area" id="import-input" placeholder="Soru verisini buraya yapıştır..."></textarea>
      <button class="btn-import" onclick="importQuestions()">🚀 Soruları Uygulamaya Yükle</button>
      <button class="btn-import" style="background:var(--danger); margin-left:8px;" onclick="resetQuestions()">🗑 Soruları Sıfırla</button>
    </div>
  </div>
</div>

<script>
  let defaultQuestions = [
    {
      id: 201,
      branch: "Anatomi",
      year: "2023 Sonbahar",
      text: "Fossa cranii media'da yer alan ve nervus maxillaris'in kafatasını terk ettiği açıklık aşağıdakilerden hangisidir?",
      options: ["Foramen rotundum", "Foramen ovale", "Foramen spinosum", "Foramen lacerum", "Fissura orbitalis superior"],
      correct: 0,
      exp: "Nervus maxillaris (V2) fossa cranii media'da bulunan foramen rotundum'dan geçerek fossa pterygopalatina'ya ulaşır."
    }
  ];

  let sampleQuestions = JSON.parse(localStorage.getItem('tus_custom_qs')) || defaultQuestions;
  let wrongQuestions = JSON.parse(localStorage.getItem('tus_wrong_qs')) || [];

  let currentMode = 'quiz';
  let currentIdx = 0;
  let score = 0;
  let timer;
  let timeLeft = 90;
  let currentShuffledOptions = [];
  let currentCorrectIdx = 0;

  function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function initApp() {
    sampleQuestions = shuffleArray(sampleQuestions);
    loadQuestion();
    startTimer();
  }

  function toggleTheme() {
    document.body.classList.toggle('dark');
  }

  function switchMode(mode, btnElement) {
    currentMode = mode;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');

    document.getElementById('quiz-view').style.display = (mode === 'quiz' || mode === 'srs' || mode === 'wrong') ? 'block' : 'none';
    document.getElementById('import-view').style.display = (mode === 'import') ? 'block' : 'none';
    document.getElementById('meta-bar').style.display = (mode === 'import') ? 'none' : 'flex';

    if (mode === 'quiz' || mode === 'srs' || mode === 'wrong') {
      currentIdx = 0;
      loadQuestion();
    }
  }

  function shuffleOptions(optionsArray, correctOriginalIndex) {
    let indexedOptions = optionsArray.map((opt, i) => ({ text: opt, isCorrect: i === correctOriginalIndex }));
    indexedOptions = shuffleArray(indexedOptions);

    const shuffledTexts = indexedOptions.map(o => o.text);
    const newCorrectIndex = indexedOptions.findIndex(o => o.isCorrect);

    return { shuffledTexts, newCorrectIndex };
  }

  function loadQuestion() {
    clearInterval(timer);
    timeLeft = 90;
    startTimer();

    let pool = sampleQuestions;
    if (currentMode === 'wrong') pool = wrongQuestions.length > 0 ? wrongQuestions : [];

    if (pool.length === 0) {
      document.getElementById('question-text').innerText = "Bu modda soru bulunmuyor!";
      document.getElementById('options-container').innerHTML = "";
      return;
    }

    const q = pool[currentIdx % pool.length];
    
    const { shuffledTexts, newCorrectIndex } = shuffleOptions(q.options, q.correct);
    currentShuffledOptions = shuffledTexts;
    currentCorrectIdx = newCorrectIndex;

    document.getElementById('branch-badge').innerText = `${q.branch} (${q.year})`;
    document.getElementById('question-text').innerText = `${currentIdx + 1}. ${q.text}`;
    document.getElementById('explanation-box').style.display = 'none';
    document.getElementById('next-btn').disabled = true;

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    currentShuffledOptions.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
      btn.onclick = () => selectOption(idx, q);
      container.appendChild(btn);
    });
  }

  function selectOption(selectedIdx, q) {
    clearInterval(timer);
    const buttons = document.querySelectorAll('.opt-btn');
    
    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === currentCorrectIdx) btn.classList.add('correct');
      if (idx === selectedIdx && idx !== currentCorrectIdx) btn.classList.add('wrong');
    });

    if (selectedIdx === currentCorrectIdx) {
      score += 10;
    } else {
      if (!wrongQuestions.some(item => item.id === q.id)) {
        wrongQuestions.push(q);
        localStorage.setItem('tus_wrong_qs', JSON.stringify(wrongQuestions));
      }
    }

    document.getElementById('score-text').innerText = `Puan: ${score}`;
    const expBox = document.getElementById('explanation-box');
    expBox.innerHTML = `<strong>Açıklama:</strong> ${q.exp}`;
    expBox.style.display = 'block';
    document.getElementById('next-btn').disabled = false;
  }

  function nextQuestion() {
    currentIdx++;
    loadQuestion();
  }

  function startTimer() {
    document.getElementById('timer-display').innerText = `⏱ 01:30`;
    timer = setInterval(() => {
      timeLeft--;
      let min = Math.floor(timeLeft / 60);
      let sec = timeLeft % 60;
      document.getElementById('timer-display').innerText = `⏱ ${min < 10 ? '0':''}${min}:${sec < 10 ? '0':''}${sec}`;
      if (timeLeft <= 0) {
        clearInterval(timer);
        document.getElementById('timer-display').innerText = "⏱ Süre Bitti!";
      }
    }, 1000);
  }

  function importQuestions() {
    const input = document.getElementById('import-input').value;
    try {
      const newQs = JSON.parse(input);
      if (Array.isArray(newQs)) {
        sampleQuestions = sampleQuestions.concat(newQs);
        sampleQuestions = shuffleArray(sampleQuestions);
        localStorage.setItem('tus_custom_qs', JSON.stringify(sampleQuestions));
        alert(`${newQs.length} adet yeni TUS sorusu başarıyla yüklendi!`);
        document.getElementById('import-input').value = '';
        switchMode('quiz', document.querySelectorAll('.tab-btn')[0]);
      } else {
        alert("Hatalı veri formatı!");
      }
    } catch (e) {
      alert("Yapıştırılan metin geçerli bir soru formatında değil.");
    }
  }

  function resetQuestions() {
    if (confirm("Eski hafızayı temizleyip varsayılan sorulara dönmek istediğine emin misin?")) {
      localStorage.removeItem('tus_custom_qs');
      sampleQuestions = shuffleArray(defaultQuestions);
      alert("Sorular sıfırlandı!");
      switchMode('quiz', document.querySelectorAll('.tab-btn')[0]);
    }
  }

  initApp();
</script>

</body>
</html>
