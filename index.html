<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUS Pro - Derece Çalışma İstasyonu</title>
  
  <!-- Mobil Uygulama ve İkon Ayarları -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/387/387561.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/387/387561.png">

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #e2e8f0;
      --opt-bg: #ffffff;
    }

    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
      --opt-bg: #1e293b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
    }

    .app-container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }

    .header h1 {
      font-size: 20px;
      margin: 0;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle {
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--subtext);
    }

    .badge {
      background: rgba(79, 70, 229, 0.1);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
    }

    .timer-badge {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warning);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
    }

    .question-card {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-btn {
      padding: 14px 18px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--opt-bg);
      color: var(--text);
      text-align: left;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--primary);
    }

    .opt-btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #15803d !important; font-weight: bold; }
    .opt-btn.wrong { background: #fee2e2 !important; border-color: var(--danger) !important; color: #b91c1c !important; }

    .exp-box {
      margin-top: 20px;
      padding: 16px;
      border-left: 4px solid var(--primary);
      background: rgba(79, 70, 229, 0.05);
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.6;
    }

    .srs-controls {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .srs-btn {
      flex: 1;
      padding: 12px 8px;
      border-radius: 8px;
      border: none;
      color: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .srs-btn:hover { opacity: 0.9; }
    .btn-easy { background: var(--success); }
    .btn-med { background: var(--warning); }
    .btn-hard { background: var(--danger); }

    .action-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .next-btn {
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .next-btn:disabled {
      background: var(--border);
      color: var(--subtext);
      cursor: not-allowed;
    }

    .flashcard {
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      border: 2px dashed var(--primary);
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      background: rgba(79, 70, 229, 0.02);
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>🩺 TUS Pro Çalışma İstasyonu</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙 Gece / Gündüz</button>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchMode('quiz', this)">📝 Test Modu</button>
    <button class="tab-btn" onclick="switchMode('srs', this)">🧠 Aralıklı Tekrar (Anki)</button>
    <button class="tab-btn" onclick="switchMode('wrong', this)">❌ Yanlış Havuzu</button>
    <button class="tab-btn" onclick="switchMode('flashcard', this)">⚡ Spot Kartlar</button>
  </div>

  <div id="app-body">
    <div class="meta-bar">
      <span class="badge" id="branch-badge">Farmakoloji</span>
      <span class="timer-badge" id="timer-display">⏱ 01:30</span>
      <span id="score-text">Puan: 0</span>
    </div>

    <div id="quiz-view">
      <div class="question-card" id="question-text">Soru Yükleniyor...</div>
      <div class="options-grid" id="options-container"></div>
      
      <div class="exp-box" id="explanation-box" style="display: none;"></div>
      
      <div class="srs-controls" id="srs-box" style="display: none;">
        <button class="srs-btn btn-hard" onclick="rateSRS('hard')">🔴 Zor (1 Gün)</button>
        <button class="srs-btn btn-med" onclick="rateSRS('med')">🟡 Orta (3 Gün)</button>
        <button class="srs-btn btn-easy" onclick="rateSRS('easy')">🟢 Kolay (7 Gün)</button>
      </div>

      <div class="action-row">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()" disabled>Sonraki Soru ➔</button>
      </div>
    </div>

    <div id="flashcard-view" style="display: none;">
      <div class="flashcard" id="flashcard-box" onclick="flipCard()">
        <span id="card-content">Kart Yükleniyor (Çevirmek için tıkla)</span>
      </div>
      <div class="action-row">
        <button class="next-btn" onclick="nextCard()">Sonraki Spot ➔</button>
      </div>
    </div>
  </div>
</div>

<script>
  const sampleQuestions = [
    {
      id: 1,
      branch: "Farmakoloji",
      year: "2023 Sonbahar",
      text: "Aşağıdakilerden hangisi roküronyum ve veküronyum ile oluşan nöromüsküler blokajı selektif olarak geri çeviren ajandır?",
      options: ["Sugammadek", "Atropin", "Pirenzepin", "Edrofonyum", "Neostigmin"],
      correct: 0,
      exp: "Sugammadek, roküronyum ve veküronyumu plazmada kapsülleyerek bağlayan ve nöromüsküler blokajı hızla geri çeviren modifiye gama-siklodektrindir."
    },
    {
      id: 2,
      branch: "Dahiliye",
      year: "2023 İlkbahar",
      text: "Tip 1 Diyabetes Mellitus tanılı bir hastada ketoasidoz tablosunda öncelikli acil tedavi yaklaşımı hangisidir?",
      options: ["Oral Antidiyabetik", "IV İzotonik NaCl & Regüler İnsülin", "Bikarbonat İnfüzyonu", "Subkutan Glukagon", "Potasyum Kısıtlaması"],
      correct: 1,
      exp: "DKA tedavisinde ilk ve en kritik adım dehidratasyonu düzeltmek için IV izotonik serum fizyolojik başlanması ve eş zamanlı regüler insülin infüzyonudur."
    },
    {
      id: 3,
      branch: "Anatomi",
      year: "2022 Sonbahar",
      text: "Nervus radialis hasarında görülen tipik motor kayıp aşağıdakilerden hangisidir?",
      options: ["Düşük El", "Pençe El", "Ebe Eli", "Maymun Eli", "Karpal Tünel Sendromu"],
      correct: 0,
      exp: "N. radialis önkol ekstansör kaslarını uyardığı için felcinde ekstansiyon yaptırılamaz ve 'Düşük El' tablosu gelişir."
    }
  ];

  const flashcards = [
    { front: "Sugammadek neyin antagonistidir?", back: "Roküronyum ve Veküronyum" },
    { front: "N. radialis felcinde ne görülür?", back: "Düşük El" },
    { front: "DKA tedavisinde ilk adım nedir?", back: "IV İzotonik NaCl Hidrasyonu" }
  ];

  let currentMode = 'quiz';
  let currentIdx = 0;
  let score = 0;
  let timer;
  let timeLeft = 90;
  let cardFlipped = false;
  let cardIdx = 0;

  let wrongQuestions = JSON.parse(localStorage.getItem('tus_wrong_qs')) || [];

  function initApp() {
    loadQuestion();
    startTimer();
  }

  function toggleTheme() {
    document.body.classList.toggle('dark');
  }

  function switchMode(mode, btnElement) {
    currentMode = mode;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');

    document.getElementById('quiz-view').style.display = (mode === 'flashcard') ? 'none' : 'block';
    document.getElementById('flashcard-view').style.display = (mode === 'flashcard') ? 'block' : 'none';

    if (mode === 'flashcard') {
      loadCard();
    } else {
      currentIdx = 0;
      loadQuestion();
    }
  }

  function loadQuestion() {
    clearInterval(timer);
    timeLeft = 90;
    startTimer();

    let pool = sampleQuestions;
    if (currentMode === 'wrong') {
      pool = wrongQuestions.length > 0 ? wrongQuestions : sampleQuestions;
    }

    if (pool.length === 0) {
      document.getElementById('question-text').innerText = "Bu modda henüz soru bulunmuyor!";
      document.getElementById('options-container').innerHTML = "";
      return;
    }

    const q = pool[currentIdx % pool.length];
    document.getElementById('branch-badge').innerText = `${q.branch} (${q.year})`;
    document.getElementById('question-text').innerText = `${currentIdx + 1}. ${q.text}`;
    
    document.getElementById('explanation-box').style.display = 'none';
    document.getElementById('srs-box').style.display = 'none';
    document.getElementById('next-btn').disabled = true;

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
      btn.onclick = () => selectOption(idx, q);
      container.appendChild(btn);
    });
  }

  function selectOption(selectedIdx, q) {
    clearInterval(timer);
    const buttons = document.querySelectorAll('.opt-btn');
    
    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.correct) btn.classList.add('correct');
      if (idx === selectedIdx && idx !== q.correct) btn.classList.add('wrong');
    });

    if (selectedIdx === q.correct) {
      score += 10;
    } else {
      if (!wrongQuestions.some(item => item.id === q.id)) {
        wrongQuestions.push(q);
        localStorage.setItem('tus_wrong_qs', JSON.stringify(wrongQuestions));
      }
    }

    document.getElementById('score-text').innerText = `Puan: ${score}`;

    const expBox = document.getElementById('explanation-box');
    expBox.innerHTML = `<strong>Açıklama:</strong> ${q.exp}`;
    expBox.style.display = 'block';

    if (currentMode === 'srs') {
      document.getElementById('srs-box').style.display = 'flex';
    } else {
      document.getElementById('next-btn').disabled = false;
    }
  }

  function rateSRS(level) {
    nextQuestion();
  }

  function nextQuestion() {
    currentIdx++;
    loadQuestion();
  }

  function startTimer() {
    document.getElementById('timer-display').innerText = `⏱ 01:30`;
    timer = setInterval(() => {
      timeLeft--;
      let min = Math.floor(timeLeft / 60);
      let sec = timeLeft % 60;
      document.getElementById('timer-display').innerText = `⏱ ${min < 10 ? '0':''}${min}:${sec < 10 ? '0':''}${sec}`;
      if (timeLeft <= 0) {
        clearInterval(timer);
        document.getElementById('timer-display').innerText = "⏱ Süre Bitti!";
      }
    }, 1000);
  }

  function loadCard() {
    cardFlipped = false;
    const card = flashcards[cardIdx % flashcards.length];
    document.getElementById('card-content').innerText = `❓ ${card.front}`;
  }

  function flipCard() {
    const card = flashcards[cardIdx % flashcards.length];
    cardFlipped = !cardFlipped;
    document.getElementById('card-content').innerText = cardFlipped ? `💡 ${card.back}` : `❓ ${card.front}`;
  }

  function nextCard() {
    cardIdx++;
    loadCard();
  }

  initApp();
</script>

</body>
</html>
